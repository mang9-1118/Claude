:root{

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas)}
body{font-family:"Pretendard",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink);overflow:hidden}
#stage{position:relative;width:1440px;height:1440px;overflow:hidden;background:var(--canvas)}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#shape{position:absolute;overflow:hidden;transform-origin:50% 50%;

.abs{position:absolute}
.layer{position:absolute;transform-origin:50% 50%}
.num{font-feature-settings:"tnum" 1}
svg{display:block;overflow:visible}
.ic{fill:none;stroke-linecap:round;stroke-linejoin:round}
.t-ko{letter-spacing:-.02em}
.chipt{left:0;top:0;width:64px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:.04em}

.row .tile{position:absolute;left:12px;top:12px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}

.row .ret{position:absolute;right:18px;top:20px}

  font-size:40px;font-weight:650;color:var(--ink)}
#cursor{position:absolute;left:0;top:0;transform-origin:0 0;filter:drop-shadow(0 3px 5px rgba(20,16,10,.28))}
</style>
</head>

<script>
'use strict';
/* ---------------------------------------------------------------------------
   고려전장 — one shape, twelve states, 28 beats at 120 BPM.

   Everything on screen is a pure function of time: seek(t) recomputes every
   style from scratch. Springs are closed-form step responses; a value whose
   target changes many times is the sum of one spring per change, evaluated on
   a periodic timeline so the last frame flows into the first.
--------------------------------------------------------------------------- */

const BEATS = 28;
let BEAT = 0.5, T = BEATS * BEAT, OFFSET = 0;          // re-set by build() from the beat analysis
const bt = (b) => OFFSET + b * BEAT;                    // beat → seconds

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const clamp01 = (x) => clamp(x, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (x, m) => ((x % m) + m) % m;
const easeOut3 = (p) => 1 - Math.pow(1 - p, 3);
const easeInOut3 = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const smooth = (p) => p * p * (3 - 2 * p);

const INK = [18, 18, 17], PAPER = [255, 255, 255], YEL = [255, 210, 31], OFFW = [246, 244, 240];
const MUTE_L = [140, 135, 127], CHIP_OFF = [47, 47, 46];
const rgb = (c, a) => {
  const r = Math.round(clamp(c[0], 0, 255)), g = Math.round(clamp(c[1], 0, 255)), b = Math.round(clamp(c[2], 0, 255));
  return a === undefined ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${a})`;
};

/* ---- springs ------------------------------------------------------------ */
// Unit step response of a damped spring (zeta < 1: a hint of overshoot).
function S(tau, w, z) {
  if (tau <= 0) return 0;
  if (z >= 1) { const e = Math.exp(-w * tau); return 1 - e * (1 + w * tau); }
  const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * tau);
  return 1 - e * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
}
// Free response from displacement x0 and velocity v0 (used when a drag lets go).
function release(tau, x0, v0, w, z) {
  const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * tau);
  return e * (x0 * Math.cos(wd * tau) + ((v0 + z * w * x0) / wd) * Math.sin(wd * tau));
}

// Periodic sum of springs. keys: [{b, v, w?, z?}]; v is a number.
// f(t) = last + Σ Δk·[S(t−tk) + S(t−tk+T) − 1]  — the second term is the
// previous loop's unfinished tail, so f(T) === f(0) in value and velocity.
class Track {
  constructor(keys, w = 18, z = 0.82) {
    const k = keys.map((o, i) => ({ t: mod(bt(o.b), T), v: o.v, w: o.w ?? w, z: o.z ?? z, i }));
    k.sort((a, b) => a.t - b.t || a.i - b.i);
    this.last = k[k.length - 1].v;
    let prev = this.last;
    for (const o of k) { o.d = o.v - prev; prev = o.v; }
    this.k = k.filter((o) => o.d !== 0);
  }
  at(t) {
    let v = this.last;
    for (const o of this.k) { const tau = t - o.t; v += o.d * (S(tau, o.w, o.z) + S(tau + T, o.w, o.z) - 1); }
    return v;
  }
}
// Several numbers springing together (colors, rects).
class VTrack {
  constructor(keys, w, z) { this.n = keys[0].v.length; this.c = Array.from({ length: this.n }, (_, j) => new Track(keys.map((o) => ({ ...o, v: o.v[j] })), w, z)); }
  at(t) { return this.c.map((c) => c.at(t)); }
}

/* ---- content enter / exit ---------------------------------------------- */
// Visibility window [bin, bout] in beats, wrapping across the loop point.
function env(t, bin, bout, o = {}) {
  const di = o.di ?? 0.08, du = o.du ?? 0.24, dx = o.dx ?? 0.12;
  const tin = mod(bt(bin), T), tout = tin + mod(bt(bout) - bt(bin), T);
  let best = { a: 0, e: 0, x: 1 };
  for (const k of [0, -1, 1]) {
    const tt = t + k * T;
    const e = easeOut3(clamp01((tt - tin - di) / du));
    const x = smooth(clamp01((tt - tout) / dx));
    const a = e * (1 - x);
    if (a > best.a) best = { a, e, x };
  }
  return best;
}
function show(el, e, o = {}) {
  if (e.a <= 0.002) { el.style.visibility = 'hidden'; return false; }
  const B = o.blur ?? 7, blur = (1 - e.e) * B + e.x * B;
  const s = lerp(o.sIn ?? 0.96, 1, e.e) * lerp(1, o.sOut ?? 0.98, e.x);
  const dy = (1 - e.e) * (o.dy ?? 0) - e.x * (o.dyOut ?? 0);
  el.style.visibility = 'inherit';
  el.style.opacity = e.a.toFixed(4);
  el.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
  el.style.transform = `${o.base ?? ''} translateY(${dy.toFixed(2)}px) scale(${s.toFixed(4)})`;
  return true;
}

/* ---- icons: one stroke weight everywhere ------------------------------- */
const ICONS = {
  arrow: 'M4 12h16M14 6l6 6-6 6',
  search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14ZM20.5 20.5l-4.6-4.6',
  cmd: 'M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3',
  down: 'M12 4v16M6 14l6 6 6-6',
  enter: 'M20 4v7a4 4 0 0 1-4 4H4M9 10l-5 5 5 5',
  panel: 'M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM8.5 7.5v3M12 7.5v3M15.5 7.5v3M8 16h8',

// Monotone cubic (Fritsch–Carlson) so the curve never overshoots the data.
const LT = (() => {
  const n = LOAD.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push(LOAD[i + 1] - LOAD[i]);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
  }
  return m;
})();

  return 0.6 + (CUR.x.at(Math.min(t, SLIDE_X.r)) - SLIDE_X.x0) / 560;
}
const rubber = (raw) => { const e = Math.max(0, raw - 1) * 560; return 70 * (1 - Math.exp(-e / 70)); };
function sliderState(t) {
  if (t < SLIDE_X.g || t > bt(11.5)) return { v: t < SLIDE_X.g ? 0.6 : 1, s: 0 };
  const raw = slideRaw(t), v = clamp(raw, 0, 1);
  if (t <= SLIDE_X.r) return { v, s: rubber(raw) };
  return { v, s: release(t - SLIDE_X.r, SLIDE_X.s0, SLIDE_X.v0, 15, 0.76) };
}
function isInside(t) {
  const x = CUR.x.at(t), y = CUR.y.at(t);
  return x > hx(0) && x < hx(24) && y > 420 && y < 660;
}

/* ---- render one moment -------------------------------------------------- */
function seek(tIn) {
  const t = mod(tIn, T);

  // shape
  const sl = sliderState(t);
  const cx = G.cx.at(t) + sl.s / 2, cy = G.cy.at(t);
  const w = G.w.at(t) + sl.s, h = G.h.at(t) - sl.s * 0.16;
  const r = Math.min(G.r.at(t), w / 2, h / 2);
  const ox = cx - w / 2, oy = cy - h / 2;
  const sh = E.shape.style;
  sh.left = `${ox}px`; sh.top = `${oy}px`; sh.width = `${w}px`; sh.height = `${h}px`;
  sh.borderRadius = `${r}px`; sh.background = rgb(G.bg.at(t)); sh.transform = `scale(${G.press.at(t).toFixed(4)})`;

  // camera
  const cs = CAM.s.at(t), ccx = CAM.x.at(t), ccy = CAM.y.at(t);
  E.world.style.transform = `translate(${(720 - ccx * cs).toFixed(3)}px,${(720 - ccy * cs).toFixed(3)}px) scale(${cs.toFixed(5)})`;

  const P = (el, gx, gy, gw, gh) => { el.style.left = `${gx - gw / 2 - ox}px`; el.style.top = `${gy - gh / 2 - oy}px`; };

  // 0 · button
  P(E.Lbtn, 0, 0, 400, 96);
  show(E.Lbtn, env(t, 27, 0, { di: 0.1, dx: 0.1 }));
  E.btnArrow.style.transform = `translateX(${A.arrow.at(t).toFixed(2)}px)`;

  // 1 · loader
  P(E.Lspin, 0, 0, 48, 48);
  if (show(E.Lspin, env(t, 0, 2, { di: 0.06, dx: 0.1 }), { sIn: 0.6 })) E.spin.style.transform = `rotate(${((t - bt(0)) * 520).toFixed(2)}deg)`;

  // 2 · puck (check → avatar)
  const ps = PK.s.at(t);
  if (ps > 0.5) {
    const pp = E.puck.style, px = PK.x.at(t), py = PK.y.at(t);
    pp.visibility = 'inherit'; pp.left = `${px - ps / 2 - ox}px`; pp.top = `${py - ps / 2 - oy}px`; pp.width = pp.height = `${ps}px`;
    const is = ps * 0.46, io = (ps - is) / 2;
    for (const s of [E.pkCheck, E.pkBolt]) { s.style.left = s.style.top = `${io}px`; s.setAttribute('width', is); s.setAttribute('height', is); }
    show(E.pkCheck, env(t, 2, 3, { di: 0, du: 0.01, dx: 0.1 }), { sIn: 1 });
    E.pkCheckP.style.strokeDashoffset = E.checkLen * (1 - easeOut3(clamp01((t - bt(2) - 0.06) / 0.3)));
    show(E.pkBolt, env(t, 3, 8, { di: 0.1, dx: 0.1 }), { sIn: 0.7 });
  } else E.puck.style.visibility = 'hidden';

  // 3 · dynamic island
  P(E.Lisl, 0, 0, 460, 88);
  if (show(E.Lisl, env(t, 3, 4, { di: 0.1, dx: 0.1 }))) {
    let d = '';
    for (let i = 0; i <= 40; i++) {
      const x = i * 2, taper = Math.sin((i / 40) * Math.PI);
      d += `${i ? 'L' : 'M'}${x} ${(18 + 11 * taper * Math.sin(x / 80 * Math.PI * 4 - t * 11)).toFixed(2)}`;
    }
    E.wave.setAttribute('d', d);
  }

  // 4 · panel card
  P(E.Lcard, 0, 126, 520, 340);
  if (show(E.Lcard, env(t, 4, 8, { di: 0.12, du: 0.3, dx: 0.12 }))) {
    E.chip.style.background = rgb(A.chipBg.at(t));
    show(E.chipOff, env(t, 4, 5, { di: 0, du: 0.01, dx: 0.08 }), { sIn: 1 });
    show(E.chipOn, env(t, 5, 8, { di: 0.04, du: 0.16 }), { sIn: 0.9 });
    E.pwr.style.background = rgb(A.pwrBg.at(t));
    E.pwr.style.transform = `scale(${A.pwrPress.at(t).toFixed(4)})`;
    const p = A.pwrP.at(t), pc = clamp01(p);
    const arc = ARC_PTS.map((a, i) => [lerp(a[0], BOLT_PTS[i][0], p), lerp(a[1], BOLT_PTS[i][1], p)]);
    const rot = Math.sin(Math.PI * pc) * -14;
    E.pwrArc.setAttribute('d', 'M' + arc.map((q) => `${q[0].toFixed(3)} ${q[1].toFixed(3)}`).join('L'));
    E.pwrArc.setAttribute('transform', `rotate(${rot.toFixed(2)} 12 12)`);
    E.pwrArc.setAttribute('stroke-width', (STROKE * 24 / 44).toFixed(3));
    const ly0 = lerp(3, 2, pc), ly1 = lerp(12, 2, pc);
    E.pwrLine.setAttribute('d', `M${lerp(12, 13.5, pc).toFixed(3)} ${ly0.toFixed(3)}L${lerp(12, 13.5, pc).toFixed(3)} ${ly1.toFixed(3)}`);
    E.pwrLine.setAttribute('stroke-width', (STROKE * 24 / 44).toFixed(3));
    E.pwrLine.style.opacity = (1 - smooth(clamp01(pc * 1.6))).toFixed(3);
    E.volt.textContent = Math.round(clamp(A.volt.at(t), 0, 999));
    const v = scrubV(t);
    E.fill.style.width = `${v * 456}px`;
    E.fill.style.background = t >= X.fullAt && t < bt(9) ? rgb(lerpC(PAPER, YEL, smooth(clamp01((t - X.fullAt) / 0.12)))) : '#fff';
    E.handle.style.left = `${v * 456 - 13}px`;
    E.handle.style.transform = `scale(${A.grab.at(t).toFixed(4)})`;
    E.pct.textContent = `${Math.round(v * 100)}%`;
    for (const el of E.stages) el.style.visibility = 'hidden';
    for (const w of X.stageWin) {
      const tin = (w.a - OFFSET) / BEAT, tout = (w.b - OFFSET) / BEAT;
      show(E.stages[w.s], env(t, tin, tout, { di: 0.02, du: 0.14, dx: 0.06 }), { sIn: 1, dy: 6, dyOut: 6, blur: 5 });
    }
  }

  // 5 · brightness slider (lives on the shape's actual rect, stretch included)
  if (show(E.Lsl, env(t, 8, 11, { di: 0.02, du: 0.2, dx: 0.1 }), { sIn: 1 })) {
    const L = E.Lsl.style; L.left = '0px'; L.top = '0px'; L.width = `${w}px`; L.height = `${h}px`;
    const f = Math.max(h, sl.v * w);
    const fs = E.slFill.style; fs.width = `${f}px`; fs.height = `${h}px`; fs.borderRadius = `${h / 2}px`;
    E.slL.style.clipPath = `inset(0 ${Math.max(0, w - f).toFixed(2)}px 0 0)`;
    const txt = `${Math.round(sl.v * 100)}%`;
    for (const el of E.slVals) el.textContent = txt;
    E.bulbGlass.setAttribute('fill-opacity', t >= T_MAX ? smooth(clamp01((t - T_MAX) / 0.1)).toFixed(3) : '0');
  }

  // 6 · knob (toggle knob → tab indicator → palette highlight → toast icon)
  const kL = KN.L.at(t), kR = KN.R.at(t), kT = KN.T.at(t), kB = KN.B.at(t);
  const kr = Math.min(KN.r.at(t), (kR - kL) / 2, (kB - kT) / 2);
  const ke = env(t, 11, 27, { di: 0.1, du: 0.22, dx: 0.12 });
  if (show(E.knob, ke, { sIn: 0.5, blur: 4 })) {
    const ks = E.knob.style;
    ks.left = `${kL - ox}px`; ks.top = `${kT - oy}px`; ks.width = `${kR - kL}px`; ks.height = `${kB - kT}px`;
    ks.borderRadius = `${kr}px`; ks.background = rgb(KN.c.at(t));
  }

  // 7 · toggle — ON fills yellow behind the knob as it travels
  if (show(E.wipe, env(t, 12 - 0.02, 13, { di: 0, du: 0.01, dx: 0.14 }), { sIn: 1, blur: 0 })) {
    const ws = E.wipe.style;
    ws.left = '0px'; ws.top = '0px'; ws.height = `${h}px`; ws.borderRadius = `${h / 2}px`;
    ws.width = `${clamp(kR + 10 - ox, h, w)}px`;
  }
  P(E.Ltg, 0, 244, 320, 104);
  if (show(E.Ltg, env(t, 11, 13, { di: 0.12, dx: 0.1 }), { sIn: 1 })) {
    show(E.tgOff, env(t, 11, 12, { di: 0.12, dx: 0.08 }));
    show(E.tgOn, env(t, 12, 13, { di: 0.1, dx: 0.1 }));
  }

  // 8 · tabs — labels invert exactly where the liquid indicator covers them
  P(E.Ltabs, 0, 244, 616, 88);
  if (show(E.Ltabs, env(t, 13, 20, { di: 0.05, dx: 0.1 }), { sIn: 1, sOut: 1 })) {
    const lx = -308, ly = 200;
    E.tabsL.style.clipPath = `inset(${(kT - ly).toFixed(2)}px ${(616 - (kR - lx)).toFixed(2)}px ${(88 - (kB - ly)).toFixed(2)}px ${(kL - lx).toFixed(2)}px round ${kr.toFixed(2)}px)`;
    E.tabsL.style.opacity = ke.a.toFixed(4);
    E.tabsL.style.background = rgb(KN.c.at(t));
    for (let i = 0; i < 4; i++) {
      const e = env(t, 13 + i * 0.07, 20, { di: 0.08, du: 0.22, dx: 0.1 });
      const ps = i > 0 ? A.tabPress[i - 1].at(t) : 1;
      for (const el of [E.tabD[i], E.tabL[i]]) show(el, e, { sIn: 0.9, base: '', blur: 6 }) && (el.style.transform += ` scale(${ps.toFixed(4)})`);
    }
  }

  // 9 · chart
  P(E.Lch, 0, 450, 616, 500);
  if (show(E.Lch, env(t, 17, 20, { di: 0.12, du: 0.3, dx: 0.12 }), { sIn: 0.98 })) {
    const p = easeInOut3(clamp01((t - bt(17.2)) / (bt(18) - bt(17.2))));
    const hd = 24 * p, xd = PX(hd);
    E.clip.setAttribute('width', xd.toFixed(2));
    const penOn = p > 0.001 && p < 0.999;
    E.pen.setAttribute('cx', xd.toFixed(2)); E.pen.setAttribute('cy', PY(loadAt(hd)).toFixed(2));
    E.pen.style.opacity = penOn ? '1' : '0';
    let mx = 0; for (let i = 0; i <= 48; i++) { const hh = (i / 48) * hd; mx = Math.max(mx, loadAt(hh)); }
    E.chVal.textContent = mx.toFixed(1);
    const pk = Math.max(0, A.peak.at(t));
    E.peak.setAttribute('r', (8 * pk).toFixed(3)); E.peak.setAttribute('stroke-width', (3 * Math.min(1, pk)).toFixed(3));
    E.peak.style.opacity = pk > 0.01 ? '1' : '0';
    const he = HOVER ? env(t, (HOVER.a - OFFSET) / BEAT, (HOVER.b - OFFSET) / BEAT, { di: 0, du: 0.14, dx: 0.1 }) : { a: 0, e: 0, x: 1 };
    const hh = X.hoverH.at(t), hxL = PX(hh), hyL = PY(loadAt(hh));
    for (const el of [E.hvLine, E.hvDot]) el.style.opacity = he.a.toFixed(4);
    E.hvLine.setAttribute('x1', hxL); E.hvLine.setAttribute('x2', hxL);
    E.hvDot.setAttribute('cx', hxL); E.hvDot.setAttribute('cy', hyL);
    E.tip.style.left = `${hxL}px`; E.tip.style.top = `${hyL - 20}px`;
    if (show(E.tip, he, { base: 'translate(-50%,-100%)', sIn: 0.9, dy: 6, blur: 5 })) {
      let n = X.snaps.length ? X.snaps[0].n : 14;
      for (const o of X.snaps) if (t >= o.t) n = o.n;
      E.tip.textContent = `${String(n).padStart(2, '0')}:00 · ${LOAD[n].toFixed(1)} A`;
    }
  }

  // 10 · ⌘K palette
  P(E.Lpal, 0, 396.5, 600, 393);
  if (show(E.Lpal, env(t, 20, 25, { di: 0.1, dx: 0.1 }), { sIn: 1, sOut: 1 })) {
    let typed = '', last = -1;
    for (const [b, s] of TYPED) if (t >= bt(b) && t < bt(25.5)) { typed = s; last = bt(b); }
    E.qPh.style.opacity = t < bt(21) ? '1' : '0';
    E.qTx.textContent = typed;
    const since = last < 0 ? t - bt(20) : t - last;
    E.caret.style.opacity = since < 0.45 || mod(since - 0.45, 1) < 0.5 ? '1' : '0';
    const lx = -300, ly = 200;
    E.rowsL.style.clipPath = `inset(${(kT - ly).toFixed(2)}px ${(600 - (kR - lx)).toFixed(2)}px ${(393 - (kB - ly)).toFixed(2)}px ${(kL - lx).toFixed(2)}px round ${kr.toFixed(2)}px)`;
    E.rowsL.style.color = rgb(A.inv.at(t));
    E.rowsL.style.background = rgb(KN.c.at(t));
    const rest = rgb(A.rest.at(t));
    for (let i = 0; i < ROWS.length; i++) {
      const keep = i === 1 || i === 3;
      const e = env(t, 20 + (0.04 * i) / BEAT, keep ? 25 : 22, { di: 0.1, du: 0.22, dx: 0.12 });
      const y = 85 + 60 * A.rowSlot[i].at(t);
      for (const el of [E.rowD[i], E.rowL[i]]) { el.style.top = `${y}px`; show(el, e, { sIn: 0.97, dy: 8, blur: 6 }); }
      if (keep) E.rRest[i].style.color = rest;
    }
  }

  // 11 · toast
  P(E.Ltoast, 0, 252, 580, 104);
  if (show(E.Ltoast, env(t, 25, 27, { di: 0.1, dx: 0.1 }))) {
    E.tCheck.style.strokeDashoffset = E.checkLen * (1 - easeOut3(clamp01((t - bt(25) - 0.14) / 0.28)));
    show(E.tSub1, env(t, 25, 26, { di: 0.12, dx: 0.1 }), { sIn: 1, dy: 6, dyOut: 6, blur: 5 });
    show(E.tSub2, env(t, 26, 27, { di: 0.08, dx: 0.1 }), { sIn: 1, dy: 6, blur: 5 });
    const rp = smooth(clamp01((t - bt(25.3)) / (bt(27) - bt(25.3))));
    E.tArc.setAttribute('stroke-dashoffset', (2 * Math.PI * 11 * (1 - rp)).toFixed(3));
  }

  // keycaps (screen space)
  keycap(E.kcCmd, 664, env(t, 19.5, 20.6, { di: 0, du: 0.18, dx: 0.14 }), A.kcCmd.at(t));
  keycap(E.kcK, 776, env(t, 19.56, 20.6, { di: 0, du: 0.18, dx: 0.14 }), A.kcK.at(t));
  if (keycap(E.kcX, 720, env(t, 22.5, 24.6, { di: 0, du: 0.18, dx: 0.14 }), A.kcX.at(t))) {
    show(E.kcDown, env(t, 22.5, 23.55, { di: 0, du: 0.01, dx: 0.08 }), { sIn: 1, blur: 5 });
    show(E.kcEnter, env(t, 23.55, 24.6, { di: 0.04, du: 0.16, dx: 0.1 }), { sIn: 0.85, blur: 5 });
    for (const el of [E.kcDown, E.kcEnter]) { el.style.left = '28px'; el.style.top = '28px'; }
  }

  // cursor (screen space, tip on the world point)
  const sx = 720 + (CUR.x.at(t) - ccx) * cs, sy = 720 + (CUR.y.at(t) - ccy) * cs;
  const cp = lerp(1, 0.86, clamp01(CUR.press.at(t)));
  E.cursor.style.transform = `translate(${(sx - 5.4).toFixed(2)}px,${(sy - 4.05).toFixed(2)}px) translate(5.4px,4.05px) scale(${cp.toFixed(4)}) translate(-5.4px,-4.05px)`;
}
const lerpC = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p), lerp(a[2], b[2], p)];
function keycap(el, x, e, press) {
  const s = el.style;
  s.left = `${x - 48}px`; s.top = `${1296 - 48}px`;
  const ok = show(el, e, { sIn: 0.9, dy: 18, dyOut: -10, blur: 6 });
  if (ok) {
    const p = clamp01(press);
    s.transform += ` translateY(${(p * 5).toFixed(2)}px)`;
    s.boxShadow = `0 ${(6 - 5 * p).toFixed(2)}px 0 #D3CEC6, 0 ${(16 - 8 * p).toFixed(1)}px 30px -10px rgba(30,24,14,.32)`;
  }
  return ok;
}

/* ---- boot ---------------------------------------------------------------- */
buildDom();
build();
window.seek = seek;
window.init = (o) => build(o);
window.META = () => ({ T, BEAT, OFFSET, BEATS });
window.ready = document.fonts.load('650 20px Pretendard').then(() => document.fonts.ready).then(() => true);

// Live preview when opened directly: ?t=3.2 freezes a moment, otherwise it plays (click for sound).
const qs = new URLSearchParams(location.search);
if (qs.has('t')) seek(+qs.get('t'));
else if (!qs.has('render')) {
  const audio = new Audio('audio/soundtrack.m4a'); audio.loop = true;
  let t0 = performance.now();
  document.addEventListener('click', () => { audio.currentTime = 0; audio.play(); t0 = null; });
  const loop = (now) => { seek(t0 === null ? audio.currentTime : (now - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else seek(0);
</script>
</body>
